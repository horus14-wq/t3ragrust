name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU default per OS (t3-css.4.12)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flavor: cpu, features: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, flavor: cpu, features: "" }
          - { os: macos-15, target: aarch64-apple-darwin, flavor: cpu, features: "" }
          # aarch64 Linux: ort ships a `none` (cpu) dist for this target
          # (t3-7hc). cuda13/tensorrt/nvrtx ARM-server dists also exist but
          # need real ARM GPU hardware to be useful — cpu only for now.
          # x86_64-apple-darwin (Intel Mac) omitted: no ORT binaries exist
          # upstream anymore (dropped in ONNX Runtime 1.24).
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, flavor: cpu, features: "" }
          # EP flavors — ort-sys ships one EP per build, so each is a
          # separate artifact rather than a fat binary.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flavor: cuda, features: "ep-cuda" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, flavor: cuda, features: "ep-cuda" }
          - { os: macos-15, target: aarch64-apple-darwin, flavor: coreml, features: "ep-coreml" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flavor: openvino, features: "ep-openvino" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, flavor: openvino, features: "ep-openvino" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, flavor: directml, features: "ep-directml" }
    runs-on: ${{ matrix.os }}
    env:
      # ORT's prebuilt CoreML objects are compiled for macOS 13.4+; the
      # default 11.0 deployment target fails the link on the ep-coreml leg
      # (___isPlatformVersionAtLeast undefined). Ignored on non-Darwin.
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.flavor }}

      # libort_sys.a embeds CoreML .mm objects on every flavor; they call
      # __builtin_available -> ___isPlatformVersionAtLeast, which lives in
      # libclang_rt.osx.a and is not auto-linked under rustc's -nodefaultlibs.
      - name: clang_rt for ORT __builtin_available (macOS)
        if: runner.os == 'macOS'
        run: |
          RT="$(find "$(xcode-select -p)" -name libclang_rt.osx.a -print -quit)"
          echo "clang_rt: $RT"
          echo "RUSTFLAGS=-C link-arg=-L$(dirname "$RT") -C link-arg=-lclang_rt.osx" >> "$GITHUB_ENV"

      - name: Install mold linker (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      # EP flavors ship provider .so files inside the package; $ORIGIN rpath
      # lets the binary dlopen them from its own install dir. RUSTFLAGS env
      # replaces config rustflags, so mold must be re-specified here.
      - name: rpath $ORIGIN for bundled EP libs (Linux EP flavors)
        if: runner.os == 'Linux' && matrix.features != ''
        run: echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,$$ORIGIN' >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --release --locked
          else
            cargo build --release --locked --features "${{ matrix.features }}"
          fi
        shell: bash

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME}
          name="t3rag-${v}-${{ matrix.flavor }}-${{ matrix.target }}"
          # Stage payload outside dist/ — the release job publishes
          # dist/**/* recursively and would leak the bare binary under a
          # flavor-blind basename (last writer wins across matrix legs).
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p "pkg/$name" && cp target/release/t3rag.exe "pkg/$name/"
            # EP flavors: Windows resolves provider DLLs next to the exe —
            # ship them inside the package (found in the ort dist cache).
            if [ -n "${{ matrix.features }}" ]; then
              find "$HOME" "$LOCALAPPDATA" -name 'onnxruntime_providers_*.dll' -o -name 'onnxruntime.dll' 2>/dev/null \
                | sort -u | xargs -r -I{} cp {} "pkg/$name/"
            fi
            7z a "dist/$name.zip" "pkg/$name"
            # Get-FileHash emits just the digest — certutil prints a
            # success footer after the hash, which `tail -1` kept (GH#2).
            (cd dist && powershell -NoProfile -Command \
              "(Get-FileHash -Algorithm SHA256 '$name.zip').Hash.ToLower()" > "$name.zip.sha256")
          else
            mkdir -p "pkg/$name" && cp target/release/t3rag "pkg/$name/"
            # EP flavors: ship the dlopen'd provider .so files ($ORIGIN
            # rpath above makes them resolve next to the binary).
            if [ "${{ runner.os }}" = "Linux" ] && [ -n "${{ matrix.features }}" ]; then
              find "$HOME/.cache/ort.pyke.io" -name 'libonnxruntime_providers_*.so*' \
                -exec cp {} "pkg/$name/" \;
            fi
            tar -czf "dist/$name.tar.gz" -C pkg "$name"
            # sha256sum = GNU coreutils (all Linux runners); shasum = perl
            # (macOS). The ARM image lacks shasum — probe instead of assuming.
            (cd dist && (command -v sha256sum >/dev/null \
              && sha256sum "$name.tar.gz" \
              || shasum -a 256 "$name.tar.gz") > "$name.tar.gz.sha256")
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
