[package]
name = "t3rag"
version = "0.1.0"
edition = "2021"
description = "Rust-native retrieval over thinking traces: CLI + daemon + MCP server"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
memmap2 = "0.9"
rayon = "1"
rustc-hash = "2"
dirs = "6"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
usearch = "2"
tantivy = "0.24"
parquet = { version = "55", features = ["arrow"] }
arrow = { version = "55", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
ureq = { version = "2", default-features = false }
axum = { version = "0.8", features = ["json"] }

# Execution-provider build variants. ort-sys ships ONE binary flavor per
# build — enable at most one ep-* feature at a time (e.g.
# `cargo build --features ep-cuda`). With none enabled you get the CPU
# binary; all `--ep` values other than cpu then error at registration time.
[features]
default = []
ep-cuda = ["ort/cuda", "ort/tensorrt"]
ep-openvino = ["ort/openvino"]
ep-webgpu = ["ort/webgpu"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
