[package]
name = "t3rag"
version = "0.1.1"
edition = "2021"
description = "Rust-native retrieval over thinking traces: CLI + daemon + MCP server"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
indicatif = "0.18.1"
memmap2 = "0.9"
rayon = "1"
rustc-hash = "2"
dirs = "6"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "half"] }
half = "2"
usearch = "2"
tantivy = "0.24"
parquet = { version = "55", features = ["arrow"], optional = true }
arrow = { version = "55", default-features = false, optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
ureq = { version = "3", default-features = false, features = ["json"] }
axum = { version = "0.8", features = ["json"] }
fastembed = { version = "7.6.1", features = ["onnx", "hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

# Execution-provider build variants. ort-sys ships ONE binary flavor per
# build — enable at most one ep-* feature at a time (e.g.
# `cargo build --features ep-cuda`). With none enabled you get the CPU
# binary; all `--ep` values other than cpu then error at registration time.
[features]
default = ["parquet"]
parquet = ["dep:parquet", "dep:arrow"]
# Learned sparse leg (SPLADE) — pulls fastembed + a second ort runtime.
sparse = ["dep:fastembed"]
ep-cuda = ["ort/cuda", "ort/tensorrt"]
ep-openvino = ["ort/openvino"]
ep-webgpu = ["ort/webgpu"]
ep-coreml = ["ort/coreml"]
ep-directml = ["ort/directml"]
fastembed = ["dep:fastembed"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
