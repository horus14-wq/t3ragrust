name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm = GitHub ARM64 runner (free on public repos).
        # macos-15-intel intentionally absent: ONNX Runtime >=1.24
        # ships no x86_64-darwin binaries and ort-sys has no prebuilt dist —
        # Intel Macs can't link the embedder (t3-7hc). macos-15 (Apple
        # Silicon) works on public repos — macos-14's hosted pool is
        # retired/rejected by GitHub.
        os: [ubuntu-latest, windows-latest, macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
        # Model-dependent tests (real ~1-2GB downloads) stay out of the PR
        # path; enable with T3RAG_MODEL_TESTS=1 in a dedicated job later.
        env:
          T3RAG_MODEL_TESTS: "0"
