name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm = GitHub ARM64 runner (billed minutes on private
        # repos). macos-15-intel intentionally absent: ONNX Runtime >=1.24
        # ships no x86_64-darwin binaries and ort-sys has no prebuilt dist —
        # Intel Macs can't link the embedder (t3-7hc). macos-14 removed:
        # this private repo has no macOS hosted-runner entitlement — GitHub
        # rejects the leg at queue time ("configuration
        # 'macos-14-arm64-us-default' is not supported"). Restore if the
        # repo goes public or billing enables macOS.
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
        # Model-dependent tests (real ~1-2GB downloads) stay out of the PR
        # path; enable with T3RAG_MODEL_TESTS=1 in a dedicated job later.
        env:
          T3RAG_MODEL_TESTS: "0"
