# Repo cargo config: synced to the rch worker with the source, so it applies to
# every rch build and CI alike.
#   -fuse-ld=mold: fast linker (installed on the worker and this host).
# NOTE: no -Z flags here — they are nightly-only and break CI's stable
# toolchain (as well as any stable rch build).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# mold is multi-arch; same fast-linker treatment on aarch64 Linux
# (ubuntu-24.04-arm CI leg + ARM dev hosts).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
